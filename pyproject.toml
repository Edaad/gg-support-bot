[tool.ruff]
target-version = "py311"
line-length = 88
required-version = ">=0.16.8"
include = ["*.py", "*.pyi"]
extend-exclude = [
    "dashboard",
    "graphify-out",
]

[tool.ruff.lint]
# Explicit so Ruff upgrades do not silently expand the rule set (0.16+ defaults
# are much broader). Start with Pyflakes + the non-stylistic pycodestyle errors.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E402",  # dotenv / logging / sys.path setup before imports
    "E712",  # SQLAlchemy filters use `== False` / `== True`
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "bot",
    "cashier",
    "club_gc_settings",
    "config",
    "db",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
